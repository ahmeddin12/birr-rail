packages:
  - apps/*
  - packages/*

# Install scripts are blocked unless listed here. Prisma downloads its schema engine (needed for migrations).
allowBuilds:
  '@prisma/engines': true
  prisma: true

# Versions shared across workspace packages. Reference them with "catalog:".
catalog:
  # 6.0.x on purpose: typescript-eslint supports <6.1.0 and ts tooling is not yet TS 7 compatible.
  typescript: ~6.0.3
  '@types/node': ^24.0.0
  vite: ^8.0.0
  vitest: ^5.0.0
  zod: ^4.0.0
